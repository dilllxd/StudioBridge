[package]
name = "studiobridge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "system-tray"] }
studiobridge-core = { path = "../studiobridge-core" }
tungstenite = "0.29"

[build-dependencies]
slint-build = "1.17"
