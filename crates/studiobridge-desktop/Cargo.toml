[package]
name = "studiobridge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
extended-workspaces = []
simulated-comparison = ["extended-workspaces", "dep:studiobridge-comparison"]

[dependencies]
global-hotkey = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "system-tray"] }
studiobridge-core = { path = "../studiobridge-core" }
studiobridge-comparison = { path = "../studiobridge-comparison", optional = true }
tungstenite = "0.29"
webbrowser = "1.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["global_shortcuts"] }
futures-util = "0.3"
tokio.workspace = true

[build-dependencies]
slint-build = "1.17"
